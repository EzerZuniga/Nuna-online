<!DOCTYPE html>
<html lang="es-PE">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo completo de Nuna">
    <title>Nuna | Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="tocapu-pattern" data-page="catalog">
    <div class="scroll-progress" id="scroll-progress" style="width: 0%;"></div>

    <header class="site-header fixed w-full top-0" role="banner">
        <div class="container">
            <nav class="flex items-center justify-between h-24" aria-label="Navegación principal">
                <a href="../public/index.html" class="logo-container flex items-center space-x-3">
                    <div class="w-14 h-14 bg-gradient-to-br from-amber-800 to-amber-950 flex items-center justify-center logo-symbol">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="white" opacity="0.95"></path>
                            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2.5" opacity="0.75"></path>
                            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2.5" opacity="0.85"></path>
                        </svg>
                    </div>
                    <span class="font-display text-3xl font-bold tracking-wide" style="color: var(--tierra-media);">NUNA</span>
                </a>
                <div class="hidden lg:flex items-center space-x-2">
                    <a href="./catalogo.html" class="nav-link">Catálogo</a>
                    <a href="./nosotros.html" class="nav-link">Nuestra Historia</a>
                    <a href="./sostenibilidad.html" class="nav-link">Sostenibilidad</a>
                    <a href="./contacto.html" class="nav-link">Contacto</a>
                    <a href="./carrito.html" class="relative p-3 ml-4 hover:bg-gray-100 rounded-full transition" aria-label="Ir al carrito">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span id="cart-count-badge" class="hidden absolute -top-1 -right-1 w-6 h-6 bg-gradient-to-br from-red-500 to-red-600 text-white text-xs font-bold rounded-full flex items-center justify-center">0</span>
                    </a>
                </div>
                <button id="mobile-menu-button" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg transition" data-action="toggle-mobile-menu" aria-label="Abrir menú" aria-expanded="false">
                    <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
                </button>
            </nav>
        </div>
        <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-gray-200">
            <div class="container py-6 space-y-4">
                <a href="./catalogo.html" class="block py-2 font-medium text-lg hover:text-amber-700 transition">Catálogo</a>
                <a href="./nosotros.html" class="block py-2 font-medium text-lg hover:text-amber-700 transition">Nuestra Historia</a>
                <a href="./sostenibilidad.html" class="block py-2 font-medium text-lg hover:text-amber-700 transition">Sostenibilidad</a>
                <a href="./contacto.html" class="block py-2 font-medium text-lg hover:text-amber-700 transition">Contacto</a>
                <a href="./carrito.html" class="w-full btn btn-secondary mt-4 text-center">Ver Carrito (<span id="mobile-cart-count">0</span>)</a>
            </div>
        </div>
    </header>

    <main class="page-main">
        <section class="section-spacing">
            <div class="container">
                <div class="text-center mb-16">
                    <span class="badge badge-gold mb-4">Catálogo Completo</span>
                    <h1 class="font-display font-bold mb-4" style="color: var(--tierra-media);">Colección Nuna</h1>
                    <p class="text-lg text-gray-600 max-w-3xl mx-auto">Explora textiles, tecnología sostenible y productos gourmet andinos.</p>
                </div>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container section-spacing">
            <div class="border-t border-gray-800 pt-8">
                <p class="text-sm opacity-60">&copy; 2026 Nuna. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <div id="notification-toast" class="notification-toast" role="alert" aria-live="polite">
        <div class="flex items-center gap-3">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
            <p id="notification-message" class="font-medium"></p>
        </div>
    </div>

    <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
